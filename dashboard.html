<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Hanzz Pustaka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <header class="topbar" id="navbar"></header>
  <main class="wadah">
    <section class="sambutan">
      <h1 id="sapaan">Selamat datang</h1>
      <p id="jam"></p>
    </section>
    <section class="statistik" aria-label="Ringkasan">
      <div><strong id="statJudul">0</strong><span>judul buku</span></div>
      <div><strong id="statStok">0</strong><span>eksemplar tersedia</span></div>
      <div><strong id="statPesanan">0</strong><span>pesanan tercatat</span></div>
    </section>
    <section class="menu" aria-label="Menu utama">
      <a class="kartu menu-item" href="stok.html"><h2>Informasi Stok / Katalog</h2><p>Lihat, cari, dan tambah stok buku.</p></a>
      <a class="kartu menu-item" href="tracking.html"><h2>Tracking Pengiriman</h2><p>Lacak pesanan dengan nomor Delivery Order.</p></a>
      <button class="kartu menu-item" id="btnLaporan" type="button"><h2>Laporan Pemesanan</h2><p>Ringkasan stok, omzet, dan status pesanan.</p></button>
      <button class="kartu menu-item" id="btnHistory" type="button"><h2>History Transaksi</h2><p>Daftar seluruh transaksi yang pernah masuk.</p></button>
    </section>
    <section class="kartu" aria-labelledby="jRak"><h2 id="jRak">Koleksi di toko kami</h2><div class="rak-dash" id="rak"></div></section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
